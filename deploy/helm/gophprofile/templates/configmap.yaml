{{- if .Values.config.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
data:
  S3_REGION: {{ .Values.config.s3Region | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  TELEMETRY_ENDPOINT: {{ .Values.config.telemetryEndpoint | quote }}
  {{- with .Values.config.extraData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
